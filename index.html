    }

    }

    .hero::after {
      content: '';

      margin-top: 0;
      color: #fff;
    }

      color: #FF6B00; 
      font-weight: 700;

      .hero .subtitle { font-size: 2.5rem; }

    /* ✅ 팝업 레이어 스타일 */

      background-color: rgba(0, 0, 0, 0.4);

    .popup-close {

      top: 8px;
      right: 10px;

      border: none;
      font-size: 1.2rem;

    .popup-actions {

      display: flex;

      align-items: center;
      font-size: 0.9rem;

    }

    @keyframes popupFade {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }

  <script>
    function checkWebP(callback) {
      var img = new Image();
      img.onload = function () {
        var result = (img.width > 0) && (img.height > 0);
        callback(result);
      };
      img.onerror = function () {
        callback(false);
      };
      img.src = "data:image/webp;base64,UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEADsD+JaQAA3AAAAAA";
    }

    checkWebP(function (support) {
      if (!support) {
        document.documentElement.classList.add('no-webp');
      }
    });
  </script>

  <div id="footer-include"></div>

  <script>
    async function loadComponent(id, path, callback) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("Fetch failed");
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
        if (typeof callback === "function") callback();
      } catch (err) {
        console.error(`${path} 불러오기 실패:`, err);
      }
    }

    function bindMenuToggle() {
      const menuToggle = document.getElementById("menuToggle");
      const mainNav = document.getElementById("mainNav");

      if (menuToggle && mainNav) {
        menuToggle.addEventListener("click", () => {
          mainNav.classList.toggle("active");
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadComponent("header-include", "/components/header.html", bindMenuToggle);
      loadComponent("footer-include", "/components/footer.html");

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.fade-item').forEach(el => observer.observe(el));

      const heroObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            heroObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.3 });

      document.querySelectorAll('.hero').forEach(el => heroObserver.observe(el));
    });

    /* ✅ 팝업을 개별적으로 닫고, 둘 다 닫히면 오버레이를 숨기는 진정한 귀족의 스크립트인 것이와요 */
    function closePopupSingle(boxId, cookieName, checkboxId) {
      const checkbox = document.getElementById(checkboxId);
      if (checkbox && checkbox.checked) {
        const expiry = new Date();
        expiry.setDate(expiry.getDate() + 1);
        document.cookie = `${cookieName}=true; path=/; expires=${expiry.toUTCString()}`;
      }
      
      // 해당 팝업 박스만 먼저 숨김
      document.getElementById(boxId).style.display = "none";
      
      // 두 팝업이 모두 숨겨졌는지 확인하고 배경(오버레이)도 숨김
      const box1 = document.getElementById("popupBox1");
      const box2 = document.getElementById("popupBox2");
      const overlay = document.getElementById("popupOverlay");
      
      if ((!box1 || box1.style.display === "none") && (!box2 || box2.style.display === "none")) {
        overlay.style.display = "none";
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const show1 = !document.cookie.includes("hidePopup1=true");
      const show2 = !document.cookie.includes("hidePopup2=true");
      const overlay = document.getElementById("popupOverlay");
      const box1 = document.getElementById("popupBox1");
      const box2 = document.getElementById("popupBox2");

      // 하나라도 켜져 있어야 한다면 배경 오버레이를 띄움
      if (show1 || show2) {
        overlay.style.display = "flex";
      }
      // 쿠키가 있어서 숨겨야 하는 팝업은 개별적으로 끔
      if (!show1 && box1) {
        box1.style.display = "none";
      }
      if (!show2 && box2) {
        box2.style.display = "none";
      }
    });
  </script>

  <a href="/form.html" class="floating-btn">방문예약</a>

  <!-- ✅ 통합 팝업 레이어 (오버레이 하나에 두 개의 상자를 나란히 배치한 것이와요) -->
  <div class="popup-overlay" id="popupOverlay" style="display: none; gap: 20px; flex-wrap: wrap;">
    
    <!-- 팝업 1 -->
    <div class="popup-box" id="popupBox1">
      <button class="popup-close" onclick="closePopupSingle('popupBox1', 'hidePopup1', 'hideToday1')">✕</button>
