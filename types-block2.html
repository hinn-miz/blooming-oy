<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>블럭2 | 온양온천역 벽산 블루밍 센트럴시티</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
  
  <style>
    .type-selector {
      text-align: center;
      margin-bottom: 2rem;
    }

    .type-btn {
      padding: 0.6rem 1.2rem;
      margin: 0.4rem 0.3rem;
      border: 1px solid #ccc;
      background-color: white;
      font-weight: 500;
      cursor: pointer;
      border-radius: 999px;
      transition: 0.2s;
      display: inline-block;
    }

    .type-btn.active {
      background-color: #0B1E3B;
      color: white;
      border-color: #132f57;
    }

    .type-image {
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .type-image.visible {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .desktop-only { display: block; }
    .mobile-only { display: none; }

    @media (max-width: 768px) {
      .desktop-only { display: none; }
      .mobile-only { display: block; }
    }

    .info-section {
      padding: 4rem 1.5rem;
      background-color: #ffffff;
    }

    .info-section .container {
      max-width: 1200px;
      margin: auto;
      display: block;
      padding: 0 1rem;
    }

    /* ✅ 비율 강제 고정 및 덮어쓰기 속성을 우아하게 지워버린 것이와요 */
    .image-wrapper {
      position: relative;
      width: 100%;
      background-color: #f0f0f0; 
      border-radius: 12px;
      margin-bottom: 2rem;
      overflow: hidden;
    }
    
    .floorplan-wrapper {
      position: relative;
      width: 100%;
      background-color: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .image-wrapper picture, .floorplan-wrapper picture {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-wrapper img, .floorplan-wrapper img {
      width: 100%;
      height: auto; /* ✅ 원본 비율을 위해 auto로 변경한 것이와요 */
      display: block;
    }

    .fade-item {
      opacity: 0;
      transform: translateY(40px);
      transition: all 1.2s ease;
    }

    .fade-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 { transition-delay: 0.2s; }
    .delay-2 { transition-delay: 0.4s; }
  </style>
</head>

<body>
  <div id="header-include"></div>

  <main class="main-section">
    <section class="info-section">
      <div class="container">
        <div class="image-wrapper fade-item delay-2">
          <picture>
            <source srcset="/assets/images/type/type2.webp" type="image/webp">
            <img src="/assets/images/type/type2.png" alt="평면 메인 이미지2" loading="lazy">
          </picture>
        </div>
      </div>
    </section>

    <section class="info-section">
      <div class="container">
        <div class="type-selector">
          <button class="type-btn active" data-type="8">59㎡ A</button>
          <button class="type-btn" data-type="9">84㎡ A</button>
          <button class="type-btn" data-type="10">84㎡ B</button>
        </div>

        <div class="type-image-wrap">
          <div class="type-image type-8 visible">
             <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/8.webp" type="image/webp">
                <img src="/assets/images/type/8.png" alt="59㎡ A" loading="lazy" />
              </picture>
            </div>
          </div>

          <div class="type-image type-9">
            <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/9.webp" type="image/webp">
                <img src="/assets/images/type/9.png" alt="59㎡ B" loading="lazy" />
              </picture>
            </div>
          </div>

          <div class="type-image type-10">
            <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/10.webp" type="image/webp">
                <img src="/assets/images/type/10.png" alt="84㎡ A1" loading="lazy" />
              </picture>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-include"></div>

  <script>
    async function loadComponent(id, path, callback) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("Fetch failed");
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
        if (typeof callback === "function") callback();
      } catch (err) {
        console.error(`${path} 불러오기 실패:`, err);
      }
    }

    function bindMenuToggle() {
      const menuToggle = document.getElementById("menuToggle");
      const mainNav = document.getElementById("mainNav");
      if (menuToggle && mainNav) {
        menuToggle.addEventListener("click", () => {
          mainNav.classList.toggle("active");
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadComponent("header-include", "/components/header.html", bindMenuToggle);
      loadComponent("footer-include", "/components/footer.html");

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.fade-item').forEach(el => observer.observe(el));

      // 탭 전환 로직
      document.querySelectorAll(".type-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const type = btn.dataset.type;
          document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          document.querySelectorAll(".type-image").forEach(img => img.classList.remove("visible"));
          document.querySelector(`.type-${type}`).classList.add("visible");
        });
      });
    });
  </script>
  
  <a href="/form.html" class="floating-btn">방문예약</a>
</body>
</html>
