<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>블럭1 | 온양온천역 벽산 블루밍 센트럴시티</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <!-- 파비콘: type 속성 표준화 -->
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />

  <style>
    .type-selector {
      text-align: center;
      margin-bottom: 2rem;
    }

    .type-btn {
      padding: 0.6rem 1.2rem;
      margin: 0.4rem 0.3rem;
      border: 1px solid #ccc;
      background-color: white;
      font-weight: 500;
      cursor: pointer;
      border-radius: 999px;
      transition: 0.2s;
      display: inline-block;
    }

    .type-btn.active {
      background-color: #0B1E3B;
      color: white;
      border-color: #132f57;
    }

    /* 탭 콘텐츠 영역 */
    .type-image {
      display: none;
      /* 부드러운 전환 효과를 위해 애니메이션 추가 */
      animation: fadeIn 0.5s ease;
    }

    .type-image.visible {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .desktop-only { display: block; }
    .mobile-only { display: none; }

    @media (max-width: 768px) {
      .desktop-only { display: none; }
      .mobile-only { display: block; }
    }

    .info-section {
      padding: 4rem 1.5rem;
      background-color: #ffffff;
    }

    .info-section .container {
      max-width: 1200px;
      margin: auto;
      display: block;
      padding: 0 1rem;
    }

    /* ✅ Layout Shift 방지를 위한 공통 Wrapper (비율 강제 해제) */
    .image-wrapper {
      position: relative;
      width: 100%;
      background-color: #f0f0f0; 
      border-radius: 12px;
      margin-bottom: 2rem;
      overflow: hidden;
    }
    
    /* 탭 안의 평면도 이미지 Wrapper (비율 강제 해제) */
    .floorplan-wrapper {
      position: relative;
      width: 100%;
      background-color: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .image-wrapper picture, .floorplan-wrapper picture {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-wrapper img, .floorplan-wrapper img {
      width: 100%;
      height: auto; /* ✅ 원본 비율을 위해 auto로 변경한 것이와요 */
      display: block;
    }

    .fade-item {
      opacity: 0;
      transform: translateY(40px);
      transition: all 1.2s ease;
    }

    .fade-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 { transition-delay: 0.2s; }
  </style>
</head>

<body>
  <!-- ✅ 헤더 컴포넌트 -->
  <div id="header-include"></div>

  <main class="main-section">
    <section class="info-section">
      <div class="container">
        <!-- ✅ 상단 메인 이미지 최적화 -->
        <div class="image-wrapper fade-item delay-1">
          <picture>
            <source srcset="/assets/images/type/type1.webp" type="image/webp">
            <!-- ✅ 백업 이미지는 반드시 png로 수정한 것이와요 -->
            <img src="/assets/images/type/type1.png" alt="평면 메인 이미지1" loading="lazy">
          </picture>
        </div>
      </div>
    </section>

    <section class="info-section">
      <div class="container">
        <div class="type-selector">
          <button class="type-btn active" data-type="1">59㎡ A</button>
          <button class="type-btn" data-type="2">59㎡ B</button>
          <button class="type-btn" data-type="3">84㎡ A1</button>
          <button class="type-btn" data-type="4">84㎡ A2</button>
          <button class="type-btn" data-type="5">84㎡ B</button>
          <button class="type-btn" data-type="6">84㎡ C</button>
          <button class="type-btn" data-type="7">84㎡ D</button>
        </div>

        <div class="type-image-wrap">
          <!-- 평면도 이미지 1 -->
          <div class="type-image type-1 visible">
            <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/1.webp" type="image/webp">
                <img src="/assets/images/type/1.png" alt="59㎡ A" loading="lazy" />
              </picture>
            </div>
          </div>

          <!-- 평면도 이미지 2 -->
          <div class="type-image type-2">
            <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/2.webp" type="image/webp">
                <img src="/assets/images/type/2.png" alt="59㎡ B" loading="lazy" />
              </picture>
            </div>
          </div>

          <!-- 평면도 이미지 3 -->
          <div class="type-image type-3">
             <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/3.webp" type="image/webp">
                <img src="/assets/images/type/3.png" alt="84㎡ A1" loading="lazy" />
              </picture>
            </div>
          </div>

          <!-- 평면도 이미지 4 -->
          <div class="type-image type-4">
             <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/4.webp" type="image/webp">
                <img src="/assets/images/type/4.png" alt="84㎡ A2" loading="lazy" />
              </picture>
            </div>
          </div>

          <!-- 평면도 이미지 5 -->
          <div class="type-image type-5">
             <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/5.webp" type="image/webp">
                <img src="/assets/images/type/5.png" alt="84㎡ B" loading="lazy" />
              </picture>
            </div>
          </div>

          <!-- 평면도 이미지 6 -->
          <div class="type-image type-6">
             <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/6.webp" type="image/webp">
                <img src="/assets/images/type/6.png" alt="84㎡ C" loading="lazy" />
              </picture>
            </div>
          </div>

          <!-- 평면도 이미지 7 -->
          <div class="type-image type-7">
             <div class="floorplan-wrapper">
              <picture>
                <source srcset="/assets/images/type/7.webp" type="image/webp">
                <img src="/assets/images/type/7.png" alt="84㎡ D" loading="lazy" />
              </picture>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ✅ 푸터 컴포넌트 -->
  <div id="footer-include"></div>

  <!-- ✅ 공통 컴포넌트 JS 삽입 + 햄버거 메뉴 및 탭 처리 -->
  <script>
    async function loadComponent(id, path, callback) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("Fetch failed");
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
        if (typeof callback === "function") callback();
      } catch (err) {
        console.error(`${path} 불러오기 실패:`, err);
      }
    }

    function bindMenuToggle() {
      const menuToggle = document.getElementById("menuToggle");
      const mainNav = document.getElementById("mainNav");
      if (menuToggle && mainNav) {
        menuToggle.addEventListener("click", () => {
          mainNav.classList.toggle("active");
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadComponent("header-include", "/components/header.html", bindMenuToggle);
      loadComponent("footer-include", "/components/footer.html");

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.fade-item').forEach(el => observer.observe(el));

      // 탭 전환 로직
      document.querySelectorAll(".type-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const type = btn.dataset.type;
          document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          document.querySelectorAll(".type-image").forEach(img => img.classList.remove("visible"));
          document.querySelector(`.type-${type}`).classList.add("visible");
        });
      });
    });
  </script>
  
  <!-- ✅ 플로팅 버튼 -->
  <a href="/form.html" class="floating-btn">방문예약</a>
</body>
</html>
