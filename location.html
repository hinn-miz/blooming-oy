<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>입지안내 | 온양온천역 벽산 블루밍 센트럴시티</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
  
  <style>
    .desktop-only { display: block; }
    .mobile-only { display: none; }

    @media (max-width: 768px) {
      .desktop-only { display: none; }
      .mobile-only { display: block; }
    }

    /* ✅ 비율 강제 고정 및 덮어쓰기 속성을 우아하게 지워버린 것이와요 */
    .image-wrapper {
      position: relative;
      width: 100%;
      background-color: #f0f0f0; 
      border-radius: 12px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .image-wrapper picture {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    .fade-item {
      opacity: 0;
      transform: translateY(40px);
      transition: all 1.2s ease;
    }

    .fade-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 { transition-delay: 0.2s; }
    .delay-2 { transition-delay: 0.4s; }
    .delay-3 { transition-delay: 0.6s; }
  </style>
</head>
<body>
  <!-- ✅ 헤더 컴포넌트 -->
  <div id="header-include"></div>

  <main class="main-section">
    <section class="info-section" style="padding: 4rem 1.5rem;">
      <div class="container" style="max-width: 1200px; margin: auto; display: block; padding: 0 1rem;">
        
        <div class="image-wrapper fade-item delay-1">
          <picture>
            <source srcset="/assets/images/location/location1.webp" type="image/webp">
            <!-- ✅ 백업 이미지는 반드시 png나 jpg여야 하는 것이와요 -->
            <img src="/assets/images/location/location1.png" alt="입지 이미지1" loading="lazy">
          </picture>
        </div>

        <div class="image-wrapper fade-item delay-2">
          <picture>
            <source srcset="/assets/images/location/location2.webp" type="image/webp">
            <img src="/assets/images/location/location2.png" alt="입지 이미지2" loading="lazy">
          </picture>
        </div>

      </div>
    </section>
  </main>

  <!-- ✅ 푸터 컴포넌트 -->
  <div id="footer-include"></div>

  <!-- ✅ 공통 컴포넌트 + 햄버거 메뉴 JS 삽입 -->
  <script>
    async function loadComponent(id, path, callback) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("Fetch failed");
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
        if (typeof callback === "function") callback();
      } catch (err) {
        console.error(`${path} 불러오기 실패:`, err);
      }
    }

    function bindMenuToggle() {
      const menuToggle = document.getElementById("menuToggle");
      const mainNav = document.getElementById("mainNav");
      if (menuToggle && mainNav) {
        menuToggle.addEventListener("click", () => {
          mainNav.classList.toggle("active");
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadComponent("header-include", "/components/header.html", bindMenuToggle);
      loadComponent("footer-include", "/components/footer.html");

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.fade-item').forEach(el => observer.observe(el));
    });
  </script>
  <!-- ✅ 플로팅 버튼 -->
  <a href="/form.html" class="floating-btn">방문예약</a>
</body>
</html>
