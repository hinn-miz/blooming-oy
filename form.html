<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>문의하기 | 온양온천역 벽산 블루밍 센트럴시티</title>
  <link href="/assets/css/style.css" rel="stylesheet"/>
  <link href="/assets/images/favicon.svg" rel="icon" type="image/svg+xml"/>
  
  <style>
    /* ✅ 폼 전체 레이아웃 (본 영애가 기품을 더한 부분인 것이와요) */
    .form-container {
      max-width: 600px;
      margin: 3rem auto;
      padding: 2.5rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    
    .form-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #111;
      font-size: 1.6rem;
    }

    /* ✅ 입력 필드 스타일 */
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #333;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="tel"],
    textarea {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus,
    textarea:focus {
      border-color: #0B1E3B;
      outline: none;
    }

    .privacy-check {
      margin-bottom: 2rem;
      text-align: center;
    }

    .privacy-check label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: normal;
      cursor: pointer;
      color: #555;
    }

    .privacy-check input {
      margin-right: 0.5rem;
      width: 16px;
      height: 16px;
    }

    .submit-wrap {
      text-align: center;
    }

    /* ✅ 버튼 스타일 (기존 유지 및 정돈) */
    .submit-btn {
      background: linear-gradient(145deg, #0B1E3B, #132f57);
      color: #ffffff;
      padding: 0.8rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(11, 30, 59, 0.2);
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(145deg, #132f57, #1c4278);
      box-shadow: 0 6px 16px rgba(11, 30, 59, 0.35);
      transform: translateY(-2px);
    }

    /* ✅ 개인정보 테이블 스타일 */
    .privacy-table table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    
    .privacy-table th, .privacy-table td {
      border: 1px solid #ddd;
      padding: 0.8rem;
      text-align: center;
      color: #444;
    }
    
    .privacy-table th {
      background-color: #f8f9fa;
      font-weight: 600;
      color: #222;
    }

    .privacy-note {
      font-size: 0.85rem;
      color: #777;
      margin-top: 1rem;
      line-height: 1.4;
    }

    /* ✅ 모달 (팝업창) 스타일 */
    .modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      backdrop-filter: blur(3px);
    }
    
    .modal.hidden {
      display: none !important;
    }
    
    .modal-content {
      background: #fff;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 90%;
      width: 400px;
    }
    
    .modal-content p {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #222;
    }
    
    .modal-content button {
      background: #0B1E3B;
      color: #fff;
      border: none;
      padding: 0.6rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    
    .modal-content button:hover {
      background: #132f57;
    }
  </style>
</head>
<body>
  <div id="header-include"></div>
  
  <main class="main-section">
    <div class="form-container">
      <h2>방문 예약 및 문의하기</h2>
      <!-- ✅ 불필요한 target 속성과 중복 태그를 덜어낸 완벽한 폼인 것이와요 -->
      <form action="/" data-netlify="true" id="contact-form" method="POST" name="contact" netlify-honeypot="bot-field">
        <input name="form-name" type="hidden" value="contact"/>
        <input name="bot-field" type="hidden"/>
        
        <label for="name">이름</label>
        <input id="name" name="name" placeholder="이름을 입력해 주세요" required="" type="text"/>
        
        <label for="phone">휴대폰 번호</label>
        <input id="phone" name="phone" placeholder="010-0000-0000" required="" type="tel"/>
        
        <label for="message">문의사항</label>
        <textarea id="message" name="message" placeholder="위치,가격,대출 등 문의내용을 자유롭게 써주세요" rows="4"></textarea>
        
        <div class="privacy-check">
          <label>
            <input name="agree" required="" type="checkbox"/>
            개인정보취급방침에 동의합니다.
          </label>
        </div>
        
        <div class="submit-wrap">
          <button class="submit-btn" type="submit">방문 예약하기</button>
        </div>
      </form>
    </div>
    
    <div class="modal hidden" id="success-modal">
      <div class="modal-content">
        <p>정상적으로 등록되었습니다. 감사합니다!</p>
        <button onclick="closeModal()">닫기</button>
      </div>
    </div>
    
    <div class="form-container privacy-table">
      <h2>개인정보 수집 및 이용 안내</h2>
      <p>당사는 상담, 서비스 신청 등을 위해 아래와 같은 개인정보를 수집하고 있습니다.</p>
      <table>
        <thead>
          <tr>
            <th>수집하는 개인정보 항목</th>
            <th>목적</th>
            <th>보유기간</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>이름, 휴대폰번호</td>
            <td>분양정보 안내 및 분양상담 등 서비스</td>
            <td rowspan="2">6개월</td>
          </tr>
          <tr>
            <td>접속로그</td>
            <td>방문자 통계분석</td>
          </tr>
        </tbody>
      </table>
      <p class="privacy-note">
        ※ 개인정보보호법 제15조에 따라 수집 및 이용에 동의하지 않을 수 있으나, 동의하지 않을 경우 일부 서비스 이용에 제한이 있을 수 있습니다.
      </p>
    </div>
  </main>
  
  <div id="footer-include"></div>
  
  <script>
    const form = document.getElementById("contact-form");
    const modal = document.getElementById("success-modal");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      formData.append("form-name", "contact");

      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(formData).toString()
      })
      .then(() => {
        modal.classList.remove("hidden");
        form.reset();
      })
      .catch(() => {
        alert("제출 중 오류가 발생했습니다.");
      });
    });

    function closeModal() {
      modal.classList.add("hidden");
    }

    async function loadComponent(id, path, callback) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("Fetch failed");
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
        if (typeof callback === "function") callback();
      } catch (err) {
        console.error(`${path} 불러오기 실패:`, err);
      }
    }

    function bindMenuToggle() {
      const menuToggle = document.getElementById("menuToggle");
      const mainNav = document.getElementById("mainNav");

      if (menuToggle && mainNav) {
        menuToggle.addEventListener("click", () => {
          mainNav.classList.toggle("active");
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadComponent("header-include", "/components/header.html", bindMenuToggle);
      loadComponent("footer-include", "/components/footer.html");
    });
  </script>
</body>
</html>
